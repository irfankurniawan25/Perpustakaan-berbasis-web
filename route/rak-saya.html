    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237C3AED'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='800' font-size='58' fill='white'%3EP%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <aside id="sidebar" class="sidebar">
        <a class="navbar-brand d-flex align-items-center gap-2 mb-4 px-2" href="../index.html">
            <span class="logo">P</span>
            PustakaDigital
        </a>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard-user.html">
                <i class="bi bi-grid me-2"></i>
                Dashboard
            </a>
            <a class="nav-link" href="katalog.html">
                <i class="bi bi-book me-2"></i>
                Katalog
            </a>
            <a class="nav-link active" href="rak-saya.html">
                <i class="bi bi-bookmark me-2"></i>
                Rak Saya
            </a>
            <a class="nav-link" href="../index.html">
                <i class="bi bi-house me-2"></i>
                Beranda
            </a>
            <a class="nav-link logout" href="login.html">
                <i class="bi bi-box-arrow-right me-2"></i>
                Keluar
            </a>
        </nav>
    </aside>
    <div class="main-with-sidebar">
        <header class="topbar p-3">
            <div class="d-flex align-items-center gap-3">
                <button id="mobileMenu" class="btn btn-light mobile-menu">
                    <i class="bi bi-list"></i>
                </button>
                <div>
                    <b>Rak Saya</b>
                    <div class="small text-secondary">
                        Buku yang sudah kamu simpan.
                    </div>
                </div>
                <div class="ms-auto">
                    <span class="badge bg-ungu-muda text-ungu">User</span>
                </div>
            </div>
        </header>
        <main class="container-fluid p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="page-title">Rak Saya</h2>
                    <p class="text-secondary mb-0">Koleksi buku pribadi yang sudah kamu tambahkan.</p>
                </div>
                <span id="jumlahRak" class="badge bg-ungu-muda text-ungu rounded-pill px-3 py-2">3 Buku</span>
            </div>

            <div class="row g-4" id="rakGrid"></div>

            <div id="rakKosong" class="text-center py-5 d-none">
                <div class="card-clean p-5">
                    <i class="bi bi-bookmark" style="font-size:3rem;color:var(--abu)"></i>
                    <h5 class="mt-3">Rak kamu masih kosong</h5>
                    <p class="text-secondary">Simpan buku dari katalog untuk mulai membaca.</p>
                    <a href="katalog.html" class="btn btn-ungu mt-2">
                        <i class="bi bi-grid me-1"></i>Jelajahi Katalog
                    </a>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1080">
        <div id="toastRak" class="toast border-0" role="alert"
            style="background:var(--gelap); color:white; border-radius:12px">
            <div class="d-flex align-items-center">
                <div class="toast-body d-flex align-items-center gap-2">
                    <span
                        style="width:32px;height:32px;border-radius:8px;background:var(--ungu);display:inline-flex;align-items:center;justify-content:center">
                        <i class="bi bi-check-lg"></i>
                    </span>
                    <span id="toastRakMsg">Buku dihapus dari rak</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-3" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>

    <script>
        (function () {
            var KEY = "pustaka_rak_v1";
            var awal = [
                { judul: "Atomic Habits", penulis: "James Clear", kategori: "Pengembangan Diri", progres: 72 },
                { judul: "Clean Code", penulis: "Robert C. Martin", kategori: "Teknologi", progres: 45 },
                { judul: "Bumi Manusia", penulis: "Pramoedya Ananta Toer", kategori: "Novel", progres: 100 }
            ];
            var tema = {
                "Pengembangan Diri": { cover: "book-cover", coverStyle: "", ikon: "bi-book", warna: "var(--ungu)", badge: "bg-ungu-muda text-ungu" },
                "Teknologi": { cover: "book-cover bg-biru-muda", coverStyle: "", ikon: "bi-code-slash", warna: "var(--biru)", badge: "bg-biru-muda text-biru" },
                "Novel": { cover: "book-cover", coverStyle: "background:var(--merah-muda)", ikon: "bi-journal-text", warna: "var(--merah)", badge: "bg-danger-subtle text-danger" }
            };
            var temaDefault = tema["Pengembangan Diri"];

            var rak = muat();

            function muat() {
                try {
                    var d = JSON.parse(localStorage.getItem(KEY));
                    if (Array.isArray(d)) return d;
                } catch (e) { }
                return awal.slice();
            }
            function simpan() {
                try { localStorage.setItem(KEY, JSON.stringify(rak)); }
                catch (e) { console.error("Gagal menyimpan:", e); }
            }
            function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

            function render() {
                var grid = document.getElementById("rakGrid");
                var html = "";
                rak.forEach(function (b, i) {
                    var t = tema[b.kategori] || temaDefault;
                    var selesai = b.progres >= 100;
                    html += '<div class="col-md-6 col-lg-4 buku-rak"><div class="book-card">' +
                        '<div class="' + t.cover + '"' + (t.coverStyle ? ' style="' + t.coverStyle + '"' : '') + '>' +
                        '<i class="bi ' + t.ikon + '" style="font-size:3rem;color:' + t.warna + '"></i></div>' +
                        '<div class="p-3">' +
                        '<span class="badge ' + t.badge + '">' + esc(b.kategori || "") + '</span>' +
                        '<h5 class="fw-bold mt-2 mb-1">' + esc(b.judul) + '</h5>' +
                        '<p class="text-secondary small mb-2">' + esc(b.penulis || "") + '</p>' +
                        '<div class="progress mb-1" style="height:7px;"><div class="progress-bar" style="width:' + (b.progres || 0) + '%;background:' + t.warna + ';"></div></div>' +
                        '<p class="small text-secondary mb-3">' + (selesai ? "Selesai dibaca" : (b.progres || 0) + "% selesai dibaca") + '</p>' +
                        '<div class="d-grid gap-2">' +
                        '<a href="detail-buku.html" class="btn btn-ungu"><i class="bi ' + (selesai ? "bi-arrow-repeat" : "bi-book-half") + ' me-1"></i>' + (selesai ? "Baca Ulang" : "Lanjut Baca") + '</a>' +
                        '<button class="btn btn-light border" onclick="hapusDariRak(' + i + ')"><i class="bi bi-bookmark-x me-1"></i>Hapus dari Rak</button>' +
                        '</div></div></div></div>';
                });
                grid.innerHTML = html;
                document.getElementById("jumlahRak").textContent = rak.length + " Buku";
                document.getElementById("rakKosong").classList.toggle("d-none", rak.length !== 0);
            }

            window.hapusDariRak = function (i) {
                var b = rak[i];
                if (!b) return;
                if (!confirm('Hapus "' + b.judul + '" dari Rak Saya?')) return;
                rak.splice(i, 1);
                simpan();
                render();
                var el = document.getElementById("toastRak");
                document.getElementById("toastRakMsg").textContent = 'Buku "' + b.judul + '" dihapus dari rak.';
                bootstrap.Toast.getOrCreateInstance(el, { delay: 2500 }).show();
            };

            render();
        })();
    </script>
</body>

</html>
